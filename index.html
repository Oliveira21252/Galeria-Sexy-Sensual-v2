    // Função para renderizar as cartas
    // Função para renderizar as cartas

    function renderCards(filter = 'all') {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      const filteredCards = filter === 'all'
        ? cardsData
        : cardsData.filter(card => card.category === filter);

      filteredCards.forEach(card => {
        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4 mb-4';

        const cardElement = document.createElement('div');
        cardElement.className = 'card';
        cardElement.onclick = () => openModal(card);

        const cardContainer = document.createElement('div');
        cardContainer.className = 'card-container';

        const badge = document.createElement('div');
        badge.className = 'badge-container';
        badge.textContent = card.id;

        const img = document.createElement('img');
        img.src = card.image;
        img.className = 'card-img-top';
        img.alt = card.title;

        const cardBody = document.createElement('div');
        cardBody.className = 'card-body';

        const title = document.createElement('h5');
        title.className = 'card-title';
        title.textContent = card.title;

        const description = document.createElement('p');
        description.className = 'card-text';
        // Usando innerHTML em vez de textContent para manter a formatação HTML
        description.innerHTML = card.description.substring(0, 100) + '...';

        cardBody.appendChild(title);
        cardBody.appendChild(description);

        cardContainer.appendChild(img);
        cardContainer.appendChild(badge);

        cardElement.appendChild(cardContainer);
        cardElement.appendChild(cardBody);

        col.appendChild(cardElement);
        container.appendChild(col);
      });
    }

    // Função para abrir o modal
    function openModal(card) {
      const modalTitle = document.getElementById('cardModalLabel');
      const modalBody = document.getElementById('modalBody');

      modalTitle.textContent = card.title;

      let content = `
    <img src="${card.image}" alt="${card.title}">
    <div>${card.description}</div>
  `;

      for (const [key, value] of Object.entries(card.info)) {
        // Verifica se value é um array e usa join('') para concatenar sem vírgulas
        const infoContent = Array.isArray(value) ? value.join('') : value;

        content += `
      <div class="info-section">
        <h6 class="info-title">${key}</h6>
        <div class="info-content">${infoContent}</div>
      </div>
    `;
      }

      modalBody.innerHTML = content;

      const modal = new bootstrap.Modal(document.getElementById('cardModal'));
      modal.show();
    }

    // Configurar filtros
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderCards(this.dataset.filter);
      });
    });

    // Renderizar todas as cartas ao carregar a página
    document.addEventListener('DOMContentLoaded', function () {
      renderCards();
    });
  </script>
